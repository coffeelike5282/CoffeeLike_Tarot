name: Supabase Keep-Alive

on:
  schedule:
    # 3일마다 1회 실행 (매 3일째 00:00 UTC / 09:00 KST)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 즉시 실행 가능

jobs:
  keep-alive:
    name: Keep Alive CoffeeLike Tarot
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Services
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "============================================================"
          echo "🚀 [CoffeeLike Tarot] Supabase 핑(Keep-Alive) 요청 시작"
          echo "============================================================"
          
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::[CoffeeLike Tarot] SUPABASE_URL 또는 SUPABASE_ANON_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"

          # 1. Auth 헬스체크 엔드포인트 호출 (Supabase 서버 활성화)
          echo "1️⃣ Auth Health Check: ${CLEAN_URL}/auth/v1/health"
          AUTH_STATUS=$(curl -s -S -o /tmp/auth_res.txt -w "%{http_code}" -X GET "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || echo "CURL_FAILED")
          echo "Auth Status Code: ${AUTH_STATUS}"

          # 2. Database REST API 호출 (PostgreSQL 데이터베이스 쿼리 활성화)
          echo "2️⃣ Database Ping: ${CLEAN_URL}/rest/v1/tb_customer?select=cust_id&limit=1"
          DB_STATUS=$(curl -s -S -o /tmp/db_res.txt -w "%{http_code}" -X GET "${CLEAN_URL}/rest/v1/tb_customer?select=cust_id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || echo "CURL_FAILED")
          echo "Database Status Code: ${DB_STATUS}"

          # 둘 중 하나라도 성공(200~399)하면 프로젝트 활성화 성공 판정
          if ([ "$AUTH_STATUS" -ge 200 ] && [ "$AUTH_STATUS" -lt 400 ]) || ([ "$DB_STATUS" -ge 200 ] && [ "$DB_STATUS" -lt 400 ]); then
            echo "✅ [CoffeeLike Tarot] Supabase 프로젝트 활성 상태 유지 성공!"
          else
            echo "::error::[CoffeeLike Tarot] Supabase 요청 실패 (Auth: ${AUTH_STATUS}, DB: ${DB_STATUS})"
            echo "Auth 응답:"
            cat /tmp/auth_res.txt 2>/dev/null || echo "(없음)"
            echo "DB 응답:"
            cat /tmp/db_res.txt 2>/dev/null || echo "(없음)"
            exit 1
          fi
